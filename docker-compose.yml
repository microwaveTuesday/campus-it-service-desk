services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campus_it}
      POSTGRES_USER: ${POSTGRES_USER:-campus_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 15
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-campus_it};Username=${POSTGRES_USER:-campus_app};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-CampusIT}
      Jwt__Audience: ${JWT_AUDIENCE:-CampusITUsers}
      AllowedOrigins__0: http://localhost:3000
    depends_on: {db: {condition: service_healthy}}
    volumes: [uploads:/app/uploads]
    ports: ["8080:8080"]
  frontend:
    build:
      context: ./frontend
      args: {VITE_API_URL: /api}
    ports: ["3000:80"]
    depends_on: [api]
volumes:
  pgdata:
  uploads:
